- id: pd-004
  tipo: python
  tema: pandas
  concepto: filtro booleano
  nivel: basico
  titulo: Préstamos de más de 1000 USD
  origen: "Proyetos/Proyecto-2-Python-Ray-Franco/notebooks/kiva_loans.ipynb (celdas 14-15: filtros booleanos)"
  datos: [kiva_muestra.csv]
  enunciado: |
    Guarda en `resultado` **cuántos préstamos tienen un `loan_amount` mayor que 1000** (estrictamente mayor).
  codigo_inicial: |
    import pandas as pd

    df = pd.read_csv("kiva_muestra.csv")

    resultado = None
  solucion: |
    import pandas as pd

    df = pd.read_csv("kiva_muestra.csv")

    resultado = (df["loan_amount"] > 1000).sum()
  tests:
    - tipo: resultado
  pistas:
    - "Comparar una columna con un número da, para cada fila, True o False. Ya sabes contar Trues."
    - "df['loan_amount'] > 1000 es una máscara booleana. Puedes sumarla directamente, o usarla para filtrar el DataFrame y contar filas con len(...)."
    - "(df['loan_amount'] > 1000).sum(). Alternativa equivalente: len(df[df['loan_amount'] > 1000])."
  explicacion: |
    Una comparación sobre una columna se aplica a **todas las filas a la vez** (vectorizado). Con `df[mascara]` te quedas solo con las filas donde la máscara es `True`.

    Para combinar condiciones usa `&` (y), `|` (o) y **paréntesis**: `(df["sector"] == "Food") & (df["loan_amount"] > 1000)`. Escribir `and` en su lugar da un `ValueError`.

