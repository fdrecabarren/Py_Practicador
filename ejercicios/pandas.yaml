- id: pd-001
  tipo: python
  tema: pandas
  concepto: read_csv y shape
  nivel: basico
  titulo: Cargar Kiva y ver su tamaño
  origen: "Proyetos/Proyecto-2-Python-Ray-Franco/notebooks/kiva_loans.ipynb (celdas 1-4: read_csv y shape)"
  datos: [kiva_muestra.csv]
  enunciado: |
    El archivo `kiva_muestra.csv` es una muestra del dataset de préstamos de Kiva.

    1. Cárgalo en un DataFrame llamado `df`.
    2. Guarda en `resultado` su **forma** (número de filas y número de columnas).
  codigo_inicial: |
    import pandas as pd

    df = None
    resultado = None
  solucion: |
    import pandas as pd

    df = pd.read_csv("kiva_muestra.csv")
    resultado = df.shape
  tests:
    - tipo: resultado
  pistas:
    - "pandas tiene una función para leer un CSV y devolver un DataFrame. Y un DataFrame sabe decir cuántas filas y columnas tiene."
    - "pd.read_csv('nombre_del_archivo.csv') carga el archivo. El atributo .shape (sin paréntesis) da una tupla (filas, columnas)."
    - "df = pd.read_csv('kiva_muestra.csv') y resultado = df.shape. Sale (3008, 20): 3008 préstamos y 20 columnas, las mismas que tu proyecto."
  explicacion: |
    `shape` es un **atributo** (no lleva paréntesis) y devuelve `(filas, columnas)`. Es lo primero que se mira al cargar datos y lo que usaste en el Proyecto 2 para comprobar cuántas filas perdías al limpiar.

    Si escribes `df.shape()` obtendrás `TypeError: 'tuple' object is not callable`: ya es una tupla.

- id: pd-002
  tipo: python
  tema: pandas
  concepto: isnull().sum()
  nivel: basico
  titulo: Contar los préstamos sin fecha de financiación
  origen: "Proyetos/Proyecto-2-Python-Ray-Franco/notebooks/kiva_loans.ipynb (celdas 20-21: conteo de nulos)"
  datos: [kiva_muestra.csv]
  enunciado: |
    En Kiva, `funded_time` está vacío cuando el préstamo no llegó a financiarse del todo.

    Guarda en `resultado` **cuántos préstamos tienen `funded_time` nulo**.
  codigo_inicial: |
    import pandas as pd

    df = pd.read_csv("kiva_muestra.csv")

    resultado = None
  solucion: |
    import pandas as pd

    df = pd.read_csv("kiva_muestra.csv")

    resultado = df["funded_time"].isnull().sum()
  tests:
    - tipo: resultado
  pistas:
    - "Primero necesitas una columna de True/False que marque qué celdas están vacías. Después, contar cuántos True hay."
    - "isnull() (o isna()) devuelve True donde hay un nulo. sum() suma los True como unos."
    - "df['funded_time'].isnull().sum(). Es la misma idea que df.isnull().sum() de tu notebook, pero aplicada a una sola columna."
  explicacion: |
    `isnull()` y `isna()` son equivalentes. Al sumar un booleano, `True` vale 1 y `False` vale 0, así que `.sum()` cuenta los nulos. Con `.mean()` en lugar de `.sum()` obtienes la **proporción** de nulos.

    `df.isnull().sum()` (sin elegir columna) da el conteo de todas las columnas a la vez; con `.sort_values(ascending=False)` ves primero las más sucias.

- id: pd-003
  tipo: python
  tema: pandas
  concepto: value_counts
  nivel: basico
  titulo: Los tres sectores con más préstamos
  origen: "Proyetos/Proyecto-2-Python-Ray-Franco/notebooks/kiva_loans.ipynb (celdas 32-33 y 47-50: value_counts)"
  datos: [kiva_muestra.csv]
  enunciado: |
    Guarda en `resultado` una **Series** con los **3 sectores** (`sector`) que tienen más préstamos, con el número de préstamos de cada uno.
  codigo_inicial: |
    import pandas as pd

    df = pd.read_csv("kiva_muestra.csv")

    resultado = None
  solucion: |
    import pandas as pd

    df = pd.read_csv("kiva_muestra.csv")

    resultado = df["sector"].value_counts().head(3)
  tests:
    - tipo: resultado
  pistas:
    - "Hay un método que cuenta cuántas veces aparece cada valor de una columna y los ordena de más a menos."
    - "value_counts() ya viene ordenado de mayor a menor. Para quedarte con los primeros, usa head(n)."
    - "df['sector'].value_counts().head(3). Obtienes una Series cuyo índice son los sectores y cuyos valores son los conteos."
