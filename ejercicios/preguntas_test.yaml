- id: pq-014
  tipo: test
  tema: sql
  concepto: grano y trampa del JOIN
  nivel: intermedio
  titulo: Por qué se inflan los totales
  origen: "Proyetos/Manual_Proyecto_IV.pdf p.5 (la trampa del JOIN)"
  enunciado: |
    Unes `orders` con `order_payments` y sumas el `price` de los artículos. El total sale mucho mayor que el real. ¿Cuál es la causa más probable?
  opciones: [
    "Faltaba un ORDER BY",
    "Un pedido puede tener varias filas de pago y el JOIN repite el pedido (y su precio) en cada una",
    "SUM suma dos veces por defecto",
    "orders y order_payments no tienen columnas en común",
  ]
  correcta: 1
  explicacion: |
    Es un problema de **grano**: `orders` tiene una fila por pedido, pero `order_payments` puede tener varias. El JOIN multiplica las filas del lado "uno". La solución es agregar `order_payments` por pedido antes de unir.

- id: pq-015
  tipo: test
  tema: sql
  concepto: IS NULL
  nivel: intermedio
  titulo: Comparar con NULL
  origen: "Proyetos/.../queries/df1_actividad_clientes.sql (IS NOT NULL)"
  enunciado: |
    ¿Qué devuelve `SELECT * FROM orders WHERE order_delivered_customer_date = NULL`?
  opciones: [
    "Los pedidos sin fecha de entrega",
    "Todos los pedidos",
    "Ninguna fila, porque comparar con NULL con = nunca es verdadero",
    "Un error de sintaxis",
  ]
  correcta: 2
  explicacion: |
    En SQL, `NULL` significa "valor desconocido" y cualquier comparación con `=` da `NULL` (no verdadero). Para buscar nulos se usa `IS NULL`; para excluirlos, `IS NOT NULL`.

# ------------------------------------------------------------ Excel y Power Query
- id: pq-016
  tipo: test
  tema: excel_pq
  concepto: referencia mixta
  nivel: intermedio
  titulo: Copiar una referencia mixta
  origen: "Clases/Excel/Teoria/Introduccion_Excel.pdf p.19-20 (=$B11*H$11)"
  enunciado: |
    En la celda `J11` tienes `=$B11*H$11`. La copias a la celda de **una columna a la derecha y una fila más abajo** (`K12`).

    ¿Qué fórmula aparece en `K12`?
  opciones: ["=$B12*I$12", "=$C12*I$11", "=$B12*I$11", "=$B11*H$11"]
  correcta: 2
  explicacion: |
    El `$` bloquea lo que tiene delante. En `$B11` la **columna** B está bloqueada y la fila 11 es relativa, así que baja a 12: `$B12`.
    En `H$11` la **fila** 11 está bloqueada y la columna H es relativa, así que avanza a I: `I$11`. Resultado: `=$B12*I$11`.

