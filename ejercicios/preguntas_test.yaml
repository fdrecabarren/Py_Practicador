- id: pq-018
  tipo: test
  tema: excel_pq
  concepto: Power Query configuración regional
  nivel: junior
  titulo: Importes multiplicados por 10
  origen: "Clases/Excel/Practica/Ejercicio 2/kiva (power pivvot).xlsx frente a kiva_loans_PowerPivot.xlsx (Table.TransformColumnTypes con en-US)"
  enunciado: |
    Importas `kiva_loans.csv` en un Excel en español. El campo `funded_amount` vale `525.0` en el CSV, pero tras cambiar el tipo en Power Query aparece `5250`.

    ¿Cuál es la causa más probable?
  opciones: [
    "El CSV está corrupto",
    "Power Query redondea siempre a la decena",
    "Se cambió el tipo usando la configuración regional del Excel (español), donde el punto no es el separador decimal",
    "La columna es de tipo texto y Excel multiplica el texto por 10",
  ]
  correcta: 2
  explicacion: |
    En español el punto es separador de **miles**, así que `525.0` se lee como `5250`. La solución es cambiar el tipo **con configuración regional**: Inglés (Estados Unidos), que en M queda como `"en-US"`.
    Por eso, tras tipar, siempre se comprueba una suma conocida.

