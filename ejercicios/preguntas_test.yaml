- id: pq-022
  tipo: test
  tema: terminal_git
  concepto: área de preparación
  nivel: basico
  titulo: Entre git add y git commit
  origen: "Clases/GIT/Teoria/manual-git-github-multicuenta.md sec 6C; Terminal.pdf p.9 (git add . / git commit -m)"
  enunciado: |
    Has modificado `a.txt` y ejecutas `git add a.txt`, pero todavía no has hecho `git commit`.

    ¿Dónde están ahora los cambios de `a.txt`?
  opciones: [
    "Ya están guardados en el historial",
    "Solo en tu carpeta de trabajo, Git no sabe nada de ellos",
    "En el área de preparación, listos para entrar en el próximo commit",
    "En el repositorio remoto",
  ]
  correcta: 2
  explicacion: |
    Git tiene tres zonas: la carpeta de trabajo, el **área de preparación** (lo que llena `git add`) y el historial (lo que guarda `git commit`).
    `git status` te enseña en qué zona está cada cambio ("Changes to be committed" frente a "Changes not staged").

- id: pq-023
  tipo: test
  tema: terminal_git
  concepto: fetch frente a pull
  nivel: intermedio
  titulo: git fetch o git pull
  origen: "Proyetos/hello_world_from_PR-v2/README.md (git fetch origin, git pull)"
  enunciado: |
    ¿Qué diferencia hay entre `git fetch origin` y `git pull`?
  opciones: [
    "Ninguna, son sinónimos",
    "fetch sube tus commits y pull los baja",
    "fetch solo descarga la información del remoto; pull además la integra en tu rama (fetch + merge)",
    "pull solo funciona la primera vez que clonas",
  ]
  correcta: 2
  explicacion: |
    `git fetch` actualiza lo que sabes del remoto (`origin/main`) sin tocar tus archivos. `git pull` hace ese fetch y después un merge en tu rama actual.
    Subir es `git push`.

- id: pq-024
  tipo: test
  tema: terminal_git
  concepto: push -u
  nivel: intermedio
  titulo: La opción -u de git push
  origen: "Clases/GIT/Teoria/manual-git-github-multicuenta.md sec 6D (git push -u origin master|main)"
  enunciado: |
    ¿Qué consigue la opción `-u` en `git push -u origin main`?
  opciones: [
    "Sube también los archivos ignorados",
    "Fuerza la subida aunque el remoto tenga cambios que no tienes",
    "Vincula tu rama local con la remota, y después basta con `git push` a secas",
