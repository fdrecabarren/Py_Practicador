- id: pq-007
  tipo: test
  tema: pandas
  concepto: isnull().sum()
  nivel: basico
  titulo: Contar nulos de todas las columnas
  origen: "Proyetos/Proyecto-2-Python-Ray-Franco/notebooks/kiva_loans.ipynb (celda 20)"
  enunciado: |
    ¿Qué devuelve `df.isnull().sum()`?
  opciones: [
    "El número de valores nulos de cada columna",
    "True si hay algún nulo en el DataFrame",
    "Las filas que contienen algún nulo",
    "El porcentaje de nulos de cada columna",
  ]
  correcta: 0
