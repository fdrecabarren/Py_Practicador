- id: pq-025
  tipo: test
  tema: terminal_git
  concepto: .gitignore y secretos
  nivel: junior
  titulo: Un secreto que ya se commiteó
  origen: "Proyetos/*/.gitignore (.env); Clases/GIT/Practica (el archivo de token está fuera de los repos)"
  enunciado: |
    Commiteaste por error un `.env` con una contraseña. Después añades `.env` al `.gitignore` y haces otro commit.

    ¿La contraseña queda protegida?
  opciones: [
    "Sí: .gitignore borra el archivo del historial",
    "No: el archivo ya está en commits anteriores y sigue visible en el historial; hay que cambiar la contraseña",
    "Sí, pero solo si haces git push después",
    "No, pero se arregla con git status",
  ]
  correcta: 1
  explicacion: |
    `.gitignore` solo evita que se añadan archivos **nuevos**; no borra lo ya commiteado. El secreto sigue en el historial (y en el remoto, si ya lo subiste).
    Lo prudente es considerarlo filtrado: cambiar la contraseña o el token y, solo si hace falta, limpiar el historial.
