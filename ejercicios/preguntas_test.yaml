# ------------------------------------------------------------ Python básico
- id: pq-001
  tipo: test
  tema: python_basico
  concepto: input devuelve texto
  nivel: basico
  titulo: Multiplicar un texto por un número
  origen: "Clases/python/Practicas/practica/Pregunta16.py"
  enunciado: |
    Se ejecuta este programa y el usuario escribe `ab` y después `3`:

    ```python
    x = input()
    y = int(input())
    print(x * y)
    ```

    ¿Qué se imprime?
  opciones: ["ababab", "ab3", "Da un error (TypeError)", "ab ab ab"]
  correcta: 0
  explicacion: |
    `input()` devuelve texto, así que `x` vale `"ab"`. `int(input())` convierte el segundo valor en el número `3`. Multiplicar un texto por un entero lo **repite**: `"ab" * 3` es `"ababab"`.

- id: pq-002
  tipo: test
  tema: python_basico
  concepto: print con sep
  nivel: basico
  titulo: Asignación encadenada y separador
  origen: "Clases/python/Practicas/practica/Pregunta17.py"
  enunciado: |
    ¿Qué imprime este código?

    ```python
    z = y = x = 1
    print(x, y, z, sep='x')
    ```
  opciones: ["1 1 1", "1x1x1", "111", "xxx"]
  correcta: 1
  explicacion: |
    La asignación encadenada da el valor `1` a las tres variables. `sep='x'` cambia el separador de `print`, que normalmente es un espacio, por la letra `x`: `1x1x1`.

- id: pq-003
  tipo: test
  tema: python_basico
  concepto: operadores // y %
  nivel: basico
  titulo: División entera y resto
  origen: "Clases/python/Practicas/practica/pregunta13.py y Pregunta15.py"
  enunciado: |
    ¿Qué imprime `print(7 // 2, 7 % 2)`?
  opciones: ["3.5 1", "3 1", "3 3", "4 1"]
  correcta: 1
  explicacion: |
    `7 // 2` es la división entera (descarta los decimales): `3`. `7 % 2` es el resto de dividir 7 entre 2: `1`. Con `/` obtendrías `3.5`.

- id: pq-004
  tipo: test
  tema: python_basico
  concepto: precedencia de operadores
  nivel: basico
  titulo: Precedencia con un float
  origen: "Clases/python/Practicas/practica/Pregunta18.py"
  enunciado: |
    ¿Qué valor imprime `print(2 + 3 * 5.)`?
  opciones: ["25", "25.0", "17", "17.0"]
  correcta: 3
  explicacion: |
    La multiplicación se hace antes que la suma: `3 * 5.` da `15.0` y después `2 + 15.0` da `17.0`. El punto detrás del 5 convierte el número en `float`, y mezclar `int` con `float` da `float`.

- id: pq-005
  tipo: test
  tema: python_basico
  concepto: ValueError al convertir
  nivel: basico
  titulo: Convertir un texto que no es un número
  origen: "Clases/python/Practicas/py4e/ex_02_02/ex_04.py"
  enunciado: |
    ¿Qué ocurre al ejecutar `float("5 degress")`?
  opciones: ["Devuelve 5.0", "Devuelve 0.0", "Lanza un ValueError", "Lanza un NameError"]
  correcta: 2
  explicacion: |
    `float()` solo acepta textos que representen un número completo. `"5 degress"` no lo es, y Python lanza `ValueError: could not convert string to float`. Se puede controlar con `try/except ValueError`.

