- id: pb-011
  tipo: python
  tema: python_basico
  concepto: funciones con return y división segura
  nivel: junior
  titulo: Porcentaje financiado sin dividir entre cero
  origen: "Clases/Excel/Practica/Ejecicio 1/PowerQuery_Kiva.pdf p.11 (Pct_Financiado) y PowerPivot_Kiva.pdf p.10 (DIVIDE)"
  enunciado: |
    En Power Query creaste la columna `Pct_Financiado` y en DAX usaste `DIVIDE` para evitar el error de dividir entre cero.

    Escribe la función `porcentaje_financiado(financiado, solicitado)` que **devuelva** el porcentaje financiado **redondeado a 2 decimales**.

    - Si `solicitado` es 0, devuelve `0.0` en lugar de fallar.
    - Ejemplos: `(300, 400)` devuelve `75.0`; `(1, 3)` devuelve `33.33`.
  codigo_inicial: |
    def porcentaje_financiado(financiado, solicitado):
        return financiado / solicitado * 100
  solucion: |
    def porcentaje_financiado(financiado, solicitado):
        if solicitado == 0:
            return 0.0
        return round(financiado / solicitado * 100, 2)
  tests:
    - tipo: funcion
      nombre: porcentaje_financiado
      casos:
        - {args: [525, 525], esperado: 100.0}
        - {args: [300, 400], esperado: 75.0}
        - {args: [1, 3], esperado: 33.33}
        - {args: [0, 500], esperado: 0.0}
        - {args: [0, 0], esperado: 0.0}
  pistas:
    - "Hay dos casos distintos: cuando se puede dividir y cuando no. Una función puede salir antes con un return."
    - "Comprueba primero if solicitado == 0: return 0.0. Después calcula el porcentaje y redondea con round(valor, 2)."
    - "if solicitado == 0: return 0.0 y, a continuación, return round(financiado / solicitado * 100, 2). El código inicial lanza ZeroDivisionError con (0, 0) y no redondea."
  explicacion: |
    Un `return` termina la función al instante: por eso el caso especial va **antes** del cálculo y no hace falta un `else`. `round(x, 2)` redondea a dos decimales.

    Es la misma idea que `DIVIDE(a; b)` en DAX o `SI.ERROR` en Excel, pero comprobando el caso problemático antes de que ocurra el error.

- id: pb-012
  tipo: python
  tema: python_basico
  concepto: try / except
  nivel: junior
  titulo: Convertir a Celsius sin que el programa se rompa
  origen: "Clases/python/Practicas/py4e/ex_02_02/ex_04.py (ValueError con '5 degress')"
  enunciado: |
    En tu `ex_04.py` el texto `"5 degress"` hacía fallar `float(temp)` con un `ValueError`.

    Escribe la función `a_celsius(texto)` que reciba una temperatura en Fahrenheit **como texto** y devuelva los grados Celsius (`(F - 32) * 5 / 9`).

    Si el texto **no se puede convertir a número**, devuelve `None` en lugar de lanzar el error.
  codigo_inicial: |
    def a_celsius(texto):
        fahr = float(texto)
        return (fahr - 32.0) * 5.0 / 9.0
  solucion: |
    def a_celsius(texto):
        try:
            fahr = float(texto)
        except ValueError:
            return None
        return (fahr - 32.0) * 5.0 / 9.0
  tests:
    - tipo: funcion
      nombre: a_celsius
      casos:
        - {args: ["212"], esperado: 100.0}
        - {args: ["32"], esperado: 0.0}
        - {args: ["-40"], esperado: -40.0}
        - {args: ["5 degress"], esperado: null}
        - {args: [""], esperado: null}
  pistas:
    - "El error ocurre en una línea concreta (float(texto)). Python permite 'intentar' una línea y decidir qué hacer si falla."
    - "Rodea la conversión con try: ... except ValueError: ... y devuelve None dentro del except."
    - "try: fahr = float(texto) / except ValueError: return None. Si no salta el error, el código sigue y calcula (fahr - 32.0) * 5.0 / 9.0."
  explicacion: |
    `try/except` captura un tipo de error concreto. Capturar solo `ValueError` (y no un `except:` genérico) es importante: así no escondes otros fallos (por ejemplo un `NameError` por un nombre mal escrito).

    Para texto vacío (`""`) `float("")` también lanza `ValueError`, por eso el último caso devuelve `None`.

- id: pb-013
  tipo: python
  tema: python_basico
  concepto: list comprehension y split
  nivel: junior
  titulo: Separar y limpiar los tags de un préstamo
  origen: "Clases/Excel/Practica/Ejecicio 1/kiva_loans.csv (columna tags) y PowerQuery_Kiva.pdf p.8-9 (dividir en filas)"
  enunciado: |
    La columna `tags` de Kiva guarda varios valores en un solo texto, separados por coma, con espacios y con `#` delante.

    Guarda en `resultado` la **lista de tags limpios**: sin espacios sobrantes y sin el `#` inicial. El orden se mantiene.

    Hazlo en una sola línea con una *list comprehension*.
  codigo_inicial: |
    tags = "#Elderly, #First Loan, #Health and Sanitation, #Biz Durable Asset"

    resultado = []
  solucion: |
    tags = "#Elderly, #First Loan, #Health and Sanitation, #Biz Durable Asset"

    resultado = [t.strip().lstrip("#") for t in tags.split(",")]
  tests:
    - tipo: resultado
  pistas:
    - "Dos pasos: trocear el texto en una lista y limpiar cada trozo. Una list comprehension hace el segundo paso."
    - "tags.split(',') da la lista de trozos. Para cada trozo t, t.strip() quita espacios y .lstrip('#') quita almohadillas por la izquierda."
    - "[t.strip().lstrip('#') for t in tags.split(',')]. Resultado: ['Elderly', 'First Loan', 'Health and Sanitation', 'Biz Durable Asset']."
  explicacion: |
    `[expresion for x in lista]` construye una lista nueva aplicando la expresión a cada elemento. Es el equivalente de Python a "dividir columna por delimitador" de Power Query, y de `df["tags"].str.split(",")` en pandas.

    Ojo: `lstrip("#")` quita **todos** los caracteres `#` del principio; `strip()` solo espacios. Hace falta aplicar `.strip()` primero porque tras la coma queda un espacio delante de `#`.

- id: pb-014
  tipo: python
  tema: python_basico
  concepto: eliminar duplicados manteniendo el orden
  nivel: junior
  titulo: Deduplicar tags dentro de una celda
  origen: "Clases/Excel/Practica/Ejecicio 1/PowerQuery_Kiva.pdf p.8 (Text.Combine(List.Distinct(Text.Split)))"
  enunciado: |
    En 6.849 préstamos de Kiva los `tags` vienen repetidos dentro de la misma celda. En Power Query lo resolviste con `List.Distinct`.

    Guarda en `resultado` la lista de tags **sin repetidos**, manteniendo el **orden de primera aparición**.
  codigo_inicial: |
    tags = "user_favorite, volunteer_like, user_favorite, #Woman Owned Biz, volunteer_like"

    resultado = tags.split(", ")
  solucion: |
    tags = "user_favorite, volunteer_like, user_favorite, #Woman Owned Biz, volunteer_like"

    resultado = list(dict.fromkeys(tags.split(", ")))
  tests:
    - tipo: resultado
  pistas:
    - "Un set elimina duplicados pero no garantiza el orden. Necesitas algo que elimine duplicados y recuerde el orden."
    - "Los diccionarios de Python conservan el orden de inserción y no admiten claves repetidas. dict.fromkeys(lista) crea un diccionario con esas claves."
    - "list(dict.fromkeys(tags.split(', '))). Resultado: ['user_favorite', 'volunteer_like', '#Woman Owned Biz']. Alternativa más larga: un bucle for con un if x not in vistos."
  explicacion: |
    `dict.fromkeys(["a", "b", "a"])` da `{"a": None, "b": None}`: la segunda `"a"` no crea clave nueva. Al convertir a `list` quedan solo las claves, en orden de primera aparición.

    `list(set(lista))` también quita duplicados, pero el orden resultante es impredecible. En pandas el equivalente es `drop_duplicates()` y `Series.unique()`.

- id: pb-015
  tipo: python
  tema: python_basico
  concepto: leer un CSV con el módulo csv
  nivel: junior
  titulo: Sumar los préstamos de Kenya leyendo el CSV a mano
  origen: "Clases/GIT/Teoria/Terminal.pdf (la terminal se queda corta con CSV con comillas) y Clases/Excel/Practica/Ejecicio 1/kiva_loans.csv"
  datos: [kiva_muestra.csv]
  enunciado: |
    El archivo `kiva_muestra.csv` (muestra de Kiva) está en la carpeta de trabajo.

    Usa el módulo `csv` de Python (`csv.DictReader`) para guardar en `resultado` la **suma de `loan_amount` de los préstamos cuyo `country` es `"Kenya"`**.

    Recuerda que al leer un CSV todo llega como texto: tendrás que convertir `loan_amount` a número.
  codigo_inicial: |
    import csv

    resultado = 0
  solucion: |
    import csv

    total = 0.0
    with open("kiva_muestra.csv", newline="", encoding="utf-8") as f:
        for fila in csv.DictReader(f):
            if fila["country"] == "Kenya":
                total += float(fila["loan_amount"])
    resultado = total
  tests:
    - tipo: resultado
  pistas:
    - "Abre el archivo con open(...) dentro de un with, y recórrelo fila a fila. csv.DictReader convierte cada fila en un diccionario columna: valor."
    - "with open('kiva_muestra.csv', newline='', encoding='utf-8') as f: for fila in csv.DictReader(f): ... Dentro, filtra con fila['country'] == 'Kenya' y suma float(fila['loan_amount'])."
    - "Inicializa total = 0.0, recorre las filas con DictReader, y por cada fila de Kenya haz total += float(fila['loan_amount']). Al final resultado = total."
  explicacion: |
    `csv.DictReader` entiende las comillas del CSV (los campos `use` y `tags` llevan comas dentro), algo que `cut -d,` en la terminal no sabe hacer. Cada fila es un diccionario con **todos los valores como texto**.

    Este es el trabajo que `pd.read_csv` hace por ti en una línea (y además infiere tipos). Haberlo hecho una vez a mano ayuda a entender qué ahorra pandas.
