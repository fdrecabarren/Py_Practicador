- id: pb-001
  tipo: python
  tema: python_basico
  concepto: print con sep
  nivel: basico
  titulo: Unir tres códigos de país con un guion
  origen: "Clases/python/Practicas/practica/Pregunta17.py (print con sep)"
  enunciado: |
    En el dataset de Kiva cada país tiene un código de dos letras. Tienes tres códigos en tres variables.

    Haz que el programa imprima **una sola línea** con los tres códigos separados por un guion, sin espacios:

    `KE-PH-PE`

    Usa solo `print` con sus parámetros, sin construir el texto a mano con `+`.
  codigo_inicial: |
    pais1 = "KE"
    pais2 = "PH"
    pais3 = "PE"

    print(pais1, pais2, pais3)
  solucion: |
    pais1 = "KE"
    pais2 = "PH"
    pais3 = "PE"

    print(pais1, pais2, pais3, sep="-")
  tests:
    - tipo: salida
      esperado: "KE-PH-PE"
  pistas:
    - "print separa por defecto sus argumentos con un espacio. Piensa si se puede cambiar ese separador."
    - "print tiene un parámetro con nombre llamado sep. Se escribe al final: print(a, b, sep=...)."
    - "Añade sep=\"-\" al final del print. Así print une los tres valores con un guion en lugar de un espacio. Es el mismo parámetro que aparece en tu Pregunta17 (sep='x')."
  explicacion: |
    `print(a, b, c)` escribe los valores separados por un espacio. El parámetro `sep` cambia ese separador, y existe también `end` para cambiar lo que se escribe al final (por defecto un salto de línea).

    Error típico: escribir `print(pais1 + "-" + pais2 + "-" + pais3)`. Funciona con textos, pero falla en cuanto algún valor es un número (`TypeError`) y no usa lo que `print` ya sabe hacer.

- id: pb-002
  tipo: python
  tema: python_basico
  concepto: operadores // y %
  nivel: basico
  titulo: Cuotas completas y resto de un préstamo
  origen: "Clases/python/Practicas/practica/pregunta13.py y Pregunta15.py (// y %)"
  enunciado: |
    Un préstamo de Kiva de **875 USD** se va a devolver en cuotas de **200 USD**.

    Guarda en la variable `resultado` una tupla con dos números:

    1. cuántas cuotas completas de 200 USD caben,
    2. cuántos dólares sobran después de esas cuotas.

    Hazlo con operadores, no a mano.
  codigo_inicial: |
    prestamo = 875
    cuota = 200

    resultado = None
  solucion: |
    prestamo = 875
    cuota = 200

    resultado = (prestamo // cuota, prestamo % cuota)
  tests:
    - tipo: resultado
  pistas:
    - "Necesitas dos operaciones distintas con los mismos números: una que dé solo la parte entera de la división y otra que dé lo que sobra."
    - "La división entera se escribe // y el resto de una división se escribe %. Una tupla se escribe entre paréntesis y separada por comas: (a, b)."
    - "resultado = (prestamo // cuota, prestamo % cuota). 875 // 200 da 4 (cuatro cuotas completas) y 875 % 200 da 75 (lo que sobra). Son los mismos operadores de tus Preguntas 13 y 15."
  explicacion: |
    `//` descarta los decimales de la división (`875 / 200` daría `4.375`, pero `875 // 200` da `4`) y `%` devuelve el resto. Juntos cumplen siempre `a == (a // b) * b + (a % b)`.

    Cuidado: `/` devuelve siempre un `float`, incluso si la división es exacta (`8 / 2` es `4.0`).

- id: pb-003
  tipo: python
  tema: python_basico
  concepto: precedencia de operadores
  nivel: basico
  titulo: Importe total con comisión porcentual
  origen: "Clases/python/Practicas/practica/Pregunta18.py y Pregunta19.py (precedencia)"
  enunciado: |
    Un préstamo de **1000 USD** lleva una comisión del **2,5 %** del principal más **15 USD** fijos.

    El importe total a devolver es: principal + comisión porcentual + fijo.

    El código inicial da un resultado incorrecto. Corrígelo para que `resultado` valga el importe total correcto.
  codigo_inicial: |
    principal = 1000
    comision = 2.5    # porcentaje
    fijo = 15

    resultado = principal + comision / 100 + fijo
  solucion: |
    principal = 1000
    comision = 2.5    # porcentaje
    fijo = 15

    resultado = principal + principal * comision / 100 + fijo
  tests:
    - tipo: resultado
  pistas:
    - "Fíjate en qué se está dividiendo entre 100: ¿es la comisión en dólares o solo el porcentaje?"
    - "El 2,5 % hay que aplicarlo sobre el principal: primero multiplicas el principal por el porcentaje y luego divides entre 100."
    - "principal * comision / 100 da 25.0 dólares de comisión. El código inicial sumaba 0.025, que es solo el porcentaje convertido en fracción sin aplicarlo al principal. Resultado correcto: 1040.0."
  explicacion: |
    Python respeta la precedencia matemática: `**` primero, luego `* / // %` (de izquierda a derecha) y por último `+ -`. Por eso `2 + 3 * 5.` de tu Pregunta18 da `17.0` y no `25.0`.

    Si dudas, usa paréntesis: `principal + (principal * comision / 100) + fijo` hace lo mismo y se lee mejor.

- id: pb-004
  tipo: python
  tema: python_basico
  concepto: potencia **
  nivel: basico
  titulo: Interés compuesto a 3 años
  origen: "Clases/python/Practicas/practica/Pregunta19.py (4 ** 2)"
  enunciado: |
    Un capital de **1000 USD** crece un **5 % anual** durante **3 años** con interés compuesto.

    Cada año el capital se multiplica por `1.05`. Guarda en `resultado` el capital final.

    El código inicial no lo calcula bien. Corrígelo.
  codigo_inicial: |
    capital = 1000
    tasa = 0.05
    anios = 3

    resultado = capital * 1 + tasa * anios
  solucion: |
    capital = 1000
    tasa = 0.05
    anios = 3

    resultado = capital * (1 + tasa) ** anios
  tests:
    - tipo: resultado
  pistas:
    - "Multiplicar por 1.05 tres veces seguidas es lo mismo que multiplicar una vez por una potencia."
    - "La potencia en Python es **. El factor anual es (1 + tasa) y hay que elevarlo al número de años."
    - "capital * (1 + tasa) ** anios. Como ** tiene más precedencia que *, primero se calcula 1.05 ** 3 = 1.157625 y luego se multiplica por el capital: 1157.625."
  explicacion: |
    `**` es el operador de potencia y tiene la precedencia más alta, por eso no necesitas paréntesis alrededor de `(1 + tasa) ** anios`. Los paréntesis de `(1 + tasa)` sí son imprescindibles: sin ellos solo se elevaría `tasa`.

- id: pb-005
  tipo: python
  tema: python_basico
  concepto: input y conversión de tipos
  nivel: basico
  titulo: Calcular el pago por horas
  origen: "Clases/python/Practicas/py4e/ex_03_01/ex_03_01.py"
  enunciado: |
    Completa el programa para que pida las horas trabajadas y el precio por hora, y muestre:

    `Pagar: <total>`

    Por ejemplo, con 40 horas y 10.5 de precio por hora debe imprimir `Pagar: 420.0`.

    Pulsa **Ejecutar** para ver el error que da el código inicial y léelo con calma: te dice qué falla.
  codigo_inicial: |
    horas = input("Colocar Horas: ")
    precio = input("Colocar Precio: ")

    print("Pagar:", horas * precio)
  solucion: |
    horas = input("Colocar Horas: ")
    precio = input("Colocar Precio: ")

    pago = float(horas) * float(precio)
    print("Pagar:", pago)
  tests:
    - tipo: salida
      entrada: "40\n10.5\n"
      esperado: "Pagar: 420.0"
    - tipo: salida
      entrada: "35\n8\n"
      esperado: "Pagar: 280.0"
  pistas:
    - "input() siempre devuelve texto (str), aunque el usuario escriba un número. Piensa qué significa multiplicar dos textos."
    - "Antes de multiplicar tienes que convertir cada texto en número con float(...) (o int(...) si no hay decimales)."
    - "pago = float(horas) * float(precio) y luego print('Pagar:', pago). El error del código inicial (TypeError: can't multiply sequence by non-int of type 'str') aparece porque Python intenta repetir un texto en lugar de multiplicar números."
  explicacion: |
    `input()` devuelve siempre un `str`. Para operar hay que convertir: `float("40")` da `40.0`. Fíjate en la Pregunta16 de tu práctica: `"ab" * 3` repite el texto (`ababab`), por eso mezclar tipos no siempre da error, a veces da un resultado distinto del esperado.

    Si el usuario escribe algo que no es un número (`"cuarenta"`), `float()` lanza `ValueError`. Eso se maneja con `try/except` (ejercicio pb-012).

