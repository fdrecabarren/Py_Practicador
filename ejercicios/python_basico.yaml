- id: pb-006
  tipo: python
  tema: python_basico
  concepto: if / elif / else
  nivel: intermedio
  titulo: Clasificar un préstamo en Alto, Medio o Bajo
  origen: "Proyetos/Analisis Descriptivo con Excel/README.md (SI anidado: >4375 Alto, >1000 Medio, resto Bajo)"
  enunciado: |
    En tu proyecto de Excel clasificaste cada préstamo de Kiva con un `SI` anidado:

    - más de **4375** USD: `"Alto"`
    - más de **1000** USD (y hasta 4375): `"Medio"`
    - 1000 USD o menos: `"Bajo"`

    Escribe la función `clasificar_prestamo(monto)` que **devuelva** (con `return`) esa etiqueta. Fíjate en los límites: 4375 exacto es `"Medio"` y 1000 exacto es `"Bajo"`.
  codigo_inicial: |
    def clasificar_prestamo(monto):
        pass
  solucion: |
    def clasificar_prestamo(monto):
        if monto > 4375:
            return "Alto"
        elif monto > 1000:
            return "Medio"
        else:
            return "Bajo"
  tests:
    - tipo: funcion
      nombre: clasificar_prestamo
      casos:
        - {args: [525], esperado: "Bajo"}
        - {args: [1000], esperado: "Bajo"}
        - {args: [1001], esperado: "Medio"}
        - {args: [4375], esperado: "Medio"}
        - {args: [4376], esperado: "Alto"}
        - {args: [10000], esperado: "Alto"}
  pistas:
    - "Es la misma lógica que el SI anidado de Excel: se evalúan las condiciones de mayor a menor y la primera que se cumple decide."
    - "if monto > 4375: ... elif monto > 1000: ... else: ... Usa > (estrictamente mayor) para respetar los límites. Recuerda return en cada rama."
    - "Primero if monto > 4375 devuelve 'Alto'; si no, elif monto > 1000 devuelve 'Medio'; en cualquier otro caso else devuelve 'Bajo'. Al evaluar de mayor a menor, el elif ya sabe que monto <= 4375."
  explicacion: |
    `if / elif / else` se evalúa de arriba abajo y se detiene en la primera condición verdadera. El orden importa: si empezaras por `monto > 1000`, un préstamo de 5000 sería `"Medio"` y nunca llegarías al `"Alto"`.

    Diferencia con Excel: en Python se usa `>` con `monto`, y el texto va entre comillas; el `SI(D2>4375;"Alto";...)` se convierte en `if monto > 4375: return "Alto"`.

- id: pb-007
  tipo: python
  tema: python_basico
  concepto: while con break y acumuladores
  nivel: intermedio
  titulo: Sumar números hasta escribir "fin"
  origen: "Clases/python/Practicas/py4e/ex_05_01/ex_05_01.py (while True sin salida)"
  enunciado: |
    Tu `ex_05_01.py` pide números en un `while True` que **nunca termina**. Arréglalo:

    - El programa pide números con `input` hasta que se escribe `fin`.
    - Al terminar imprime, en una sola línea y separados por espacios: el **total**, la **cantidad** de números y la **media**.

    Ejemplo: con `10`, `20`, `30`, `fin` imprime `60.0 3 20.0`.

    Pulsa **Ejecutar** con el código inicial para ver qué error aparece cuando se escribe `fin`.
  codigo_inicial: |
    num = 0
    tot = 0.0
    while True:
        sval = input("Introducir numero: ")
        fval = float(sval)
        print(fval)
        num = num + 1
        tot = tot + fval
  solucion: |
    num = 0
    tot = 0.0
    while True:
        sval = input("Introducir numero: ")
        if sval == "fin":
            break
        tot = tot + float(sval)
        num = num + 1
    print(tot, num, tot / num)
  tests:
    - tipo: salida
      entrada: "10\n20\n30\nfin\n"
      esperado: "60.0 3 20.0"
    - tipo: salida
      entrada: "5\nfin\n"
      esperado: "5.0 1 5.0"
  pistas:
    - "Un while True solo termina con break. Hace falta una condición que lo active cuando el usuario escriba la palabra de salida."
    - "Comprueba el texto ANTES de convertirlo con float(): if sval == 'fin': break. Después del bucle imprime tot, num y tot / num."
    - "Dentro del while: lee sval, si es 'fin' haz break; si no, suma float(sval) a tot y suma 1 a num. Fuera del bucle: print(tot, num, tot / num). El ValueError del código inicial aparece porque float('fin') no se puede convertir."
  explicacion: |
    El patrón *centinela* (un valor especial que indica el final) es la forma clásica de leer datos con `while True` + `break`. Los acumuladores `num` y `tot` se inicializan fuera del bucle.

    Caso límite que este ejercicio no prueba: si el usuario escribe `fin` sin ningún número, `tot / num` divide entre cero (`ZeroDivisionError`). Un programa real lo comprobaría antes.

- id: pb-008
  tipo: python
  tema: python_basico
  concepto: for con lista y acumulador
  nivel: intermedio
  titulo: Sumar los préstamos de más de 300 USD
  origen: "Clases/Excel/Practica/Ejecicio 1/kiva_loans.csv (primeros 5 loan_amount) y README de franco_phyton_set_up (bucle for)"
  enunciado: |
    Tienes los importes de los cinco primeros préstamos del CSV de Kiva.

    Con un bucle `for`, guarda en `resultado` la **suma de los préstamos que superan 300 USD** (los de 300 o menos no cuentan).
  codigo_inicial: |
    montos = [525.0, 350.0, 225.0, 325.0, 500.0]

    resultado = 0
  solucion: |
    montos = [525.0, 350.0, 225.0, 325.0, 500.0]

    resultado = 0
    for monto in montos:
        if monto > 300:
            resultado = resultado + monto
  tests:
    - tipo: resultado
  pistas:
    - "Recorre la lista elemento a elemento y decide, para cada uno, si lo sumas o no."
    - "for monto in montos: y dentro un if monto > 300: que sume a resultado. resultado debe empezar en 0 antes del bucle."
    - "resultado = 0; for monto in montos: if monto > 300: resultado = resultado + monto. Se suman 525 + 350 + 325 + 500 = 1700.0; el 225 se ignora."
  explicacion: |
    Un acumulador es una variable que se inicializa antes del bucle (`resultado = 0`) y se actualiza en cada vuelta. Lo mismo hace `SUMAR.SI` en Excel y `df[df["loan_amount"] > 300]["loan_amount"].sum()` en pandas; aquí lo ves "por dentro".

    Error típico: poner `resultado = 0` dentro del bucle, que lo reinicia en cada vuelta y deja solo el último valor.

- id: pb-009
  tipo: python
  tema: python_basico
  concepto: métodos de str (strip, lower)
  nivel: intermedio
  titulo: Limpiar el campo use de Kiva
  origen: "Proyetos/Proyecto-2-Python-Ray-Franco/notebooks/kiva_loans.ipynb (str.strip().str.lower())"
  enunciado: |
    En Kiva, el texto libre `use` llega con espacios sobrantes y mayúsculas mezcladas.

    Guarda en `resultado` ese texto **sin espacios al principio ni al final** y **todo en minúsculas**.
  codigo_inicial: |
    uso = "  To Buy A Refrigerator For His Butcher Shop "

    resultado = uso
  solucion: |
    uso = "  To Buy A Refrigerator For His Butcher Shop "

    resultado = uso.strip().lower()
  tests:
    - tipo: resultado
  pistas:
    - "Los textos tienen métodos propios: se escriben con un punto después de la variable."
    - "uso.strip() quita los espacios de los extremos y uso.lower() pasa a minúsculas. Se pueden encadenar."
    - "uso.strip().lower(). Es el equivalente en texto simple de df['use'].str.strip().str.lower() que usaste en pandas."
  explicacion: |
    Los `str` son inmutables: `uso.strip()` **devuelve** un texto nuevo y no cambia `uso`. Por eso hay que asignar el resultado (o encadenar los métodos, como aquí).

    Más adelante verás que en pandas se escribe igual pero con `.str` delante: `df["use"].str.strip().str.lower()`.

- id: pb-010
  tipo: python
  tema: python_basico
  concepto: diccionario como contador
  nivel: intermedio
  titulo: Contar préstamos por sector a mano
  origen: "Proyetos/Proyecto-2-Python-Ray-Franco/notebooks/kiva_loans.ipynb (value_counts de sector)"
  enunciado: |
    Tienes la lista de sectores de siete préstamos. Construye en `resultado` un **diccionario** que diga cuántas veces aparece cada sector, por ejemplo `{"Health": 1, ...}`.

    Hazlo con un bucle `for` (sin `collections.Counter`): así entenderás qué hace `value_counts()` por dentro.
  codigo_inicial: |
    sectores = ["Health", "Food", "Food", "Agriculture", "Agriculture", "Agriculture", "Retail"]

    resultado = {}
  solucion: |
    sectores = ["Health", "Food", "Food", "Agriculture", "Agriculture", "Agriculture", "Retail"]

    resultado = {}
    for sector in sectores:
        resultado[sector] = resultado.get(sector, 0) + 1
  tests:
    - tipo: resultado
  pistas:
    - "Un diccionario guarda pares clave: valor. Aquí la clave es el sector y el valor es el número de veces que lo has visto."
    - "Para cada sector: si ya está en el diccionario suma 1; si no está, empieza en 1. dict.get(clave, 0) devuelve 0 cuando la clave no existe."
    - "for sector in sectores: resultado[sector] = resultado.get(sector, 0) + 1. Resultado: {'Health': 1, 'Food': 2, 'Agriculture': 3, 'Retail': 1}."
  explicacion: |
    `resultado.get(sector, 0)` evita el `KeyError` que daría `resultado[sector]` la primera vez que aparece un sector. Este patrón (contar con un diccionario) es exactamente lo que automatiza `df["sector"].value_counts()` en pandas.

